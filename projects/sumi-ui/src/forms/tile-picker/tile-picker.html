@for (option of options(); track option.value; let i = $index) {
  <button
    #tileRef
    type="button"
    role="radio"
    class="sumi-tile-picker__tile"
    [class.sumi-tile-picker__tile--selected]="isSelected(option.value)"
    [class.sumi-tile-picker__tile--special]="option.special"
    [attr.aria-checked]="isSelected(option.value)"
    [attr.tabindex]="tabIndexFor(option.value, i)"
    [disabled]="disabled() || cvaDisabled()"
    (click)="select(option.value)"
    (keydown)="onKeydown($event, i)"
  >
    <span class="sumi-tile-picker__glyph" [attr.lang]="option.lang ?? null">{{
      option.glyph
    }}</span>
    <span class="sumi-tile-picker__label">{{ option.label }}</span>
  </button>
}
