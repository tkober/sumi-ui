<div role="radiogroup" [attr.aria-disabled]="disabled() || cvaDisabled() ? 'true' : null">
  @for (option of options(); track option.value; let i = $index) {
    <button
      #optionRef
      type="button"
      role="radio"
      class="sumi-segmented-control__option"
      [class.sumi-segmented-control__option--selected]="isSelected(option.value)"
      [attr.aria-checked]="isSelected(option.value)"
      [attr.tabindex]="tabIndexFor(option.value, i)"
      [disabled]="disabled() || cvaDisabled()"
      (click)="select(option.value)"
      (keydown)="onKeydown($event, i)"
    >
      {{ option.label }}
    </button>
  }
</div>
