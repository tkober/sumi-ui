<div class="sumi-session-summary__art">
  <ng-content select="[sumiSummaryArt]" />
  @if (levelUp(); as lvl) {
    <sumi-hanko
      class="sumi-session-summary__level-hanko"
      characters="昇級"
      [label]="'Level up: ' + lvl"
      [size]="40"
    />
  }
</div>

<h2 class="sumi-session-summary__headline">{{ headline() }}</h2>

<dl class="sumi-session-summary__tiles">
  @if (hasQuizStats()) {
    <div sumiSummaryTile label="Answered">{{ answered() }}</div>
    <div sumiSummaryTile label="Correct">
      {{ correct() }} <small>({{ accuracy() }}%)</small>
    </div>
  }
  <div sumiSummaryTile label="Time">{{ duration() }}</div>
  @if (hasDelta()) {
    <div sumiSummaryTile [label]="deltaLabel() ?? 'Change'" [trend]="deltaTrend()">
      {{ delta()! > 0 ? '+' : '' }}{{ delta() }}
    </div>
  }
  <!-- Extra tiles from the app: <div sumiSummaryTile label="…">…</div> (sumi-ui#48). -->
  <ng-content />
</dl>

<button
  type="button"
  sumiButton
  variant="primary"
  [disabled]="actionDisabled()"
  [attr.aria-disabled]="actionDisabled() ? 'true' : null"
  [attr.aria-busy]="actionDisabled() ? 'true' : null"
  (click)="onActionClick()"
>
  {{ actionLabel() }}
</button>
