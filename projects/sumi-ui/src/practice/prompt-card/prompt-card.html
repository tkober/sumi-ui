@if (kind(); as k) {
  <span class="sumi-prompt-card__kind">{{ k }}</span>
}

<div class="sumi-prompt-card__text" lang="ja" [style.--glyphs]="glyphs()">{{ text() }}</div>

<ng-content />

@if (meta(); as items) {
  @if (items.length) {
    <p class="sumi-prompt-card__meta">
      @for (item of items; track $index; let last = $last) {
        <span>{{ item }}</span>
        @if (!last) {
          <span class="sumi-prompt-card__meta-dot" aria-hidden="true">·</span>
        }
      }
    </p>
  }
}
