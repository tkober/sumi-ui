<sumi-ink-backdrop layout="full" [motif]="motif()" [pattern]="pattern()" [companion]="companion()">
  <div class="sumi-session-gate__content">
    @if (title(); as t) {
      <h1 class="sumi-session-gate__title">{{ t }}</h1>
    }
    @if (text(); as t) {
      <p class="sumi-session-gate__text">{{ t }}</p>
    }

    <ng-content />

    @if (showAction()) {
      <button
        type="button"
        sumiButton
        variant="primary"
        [disabled]="actionDisabled()"
        [attr.aria-disabled]="actionDisabled() ? 'true' : null"
        [attr.aria-busy]="actionDisabled() ? 'true' : null"
        (click)="onActionClick()"
      >
        {{ actionLabel() }}
      </button>
    }
  </div>
</sumi-ink-backdrop>
