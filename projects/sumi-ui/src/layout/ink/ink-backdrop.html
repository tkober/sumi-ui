<sumi-pattern
  class="sumi-ink-backdrop__band"
  [pattern]="pattern()"
  [tileWidth]="480"
  [tileHeight]="56"
/>
<div class="sumi-ink-backdrop__content">
  <ng-content />
</div>
<sumi-landscape class="sumi-ink-backdrop__scene" [motif]="motif()" />
@if (layout() === 'full' && companion(); as c) {
  <sumi-companion class="sumi-ink-backdrop__companion" [kind]="c" [size]="56" />
}
