<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sumi UI Showcase</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Sumi UI's fonts are a separate stylesheet (see
      projects/sumi-ui/styles/sumi-fonts.scss and README.md). A plain link on
      purpose: the production build's critical-CSS inliner turns it into a
      non-blocking `media="print"` link and swaps it to `all` itself. A
      hand-written `onload` swap would race with that script and, on a
      cached reload, leave the fonts stuck on `print`.
    -->
    <link rel="stylesheet" href="sumi-fonts.css" />
  </head>

  </body>
