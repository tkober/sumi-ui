<sumi-app-shell [brand]="brand" [nav]="navItems">
  <sumi-app-switcher sumiShellSwitcher />
  <div sumiShellActions>
    <select
      class="accent-picker"
      name="accent"
      aria-label="Accent"
      [value]="selectedAccent"
      (change)="selectAccent($any($event.target).value)"
    >
      @for (item of accentPresets; track item.preset) {
        <option [value]="item.preset">{{ item.label }}</option>
      }
    </select>
  </div>
  <!-- sumiShellFocusActions is left empty here: it is only the fallback
       for a focus-mode page that registers nothing of its own. The
       Practice page (#27) registers its sumi-session-bar via
       *sumiShellFocusActions in its own template instead, wired to its own
       session state — a shell-level stand-in here that bypassed that state
       (calling shell.leaveFocusMode() directly) would double up with it
       and could desync the two. -->
  <router-outlet />
  <sumi-hotkey-help />
</sumi-app-shell>
