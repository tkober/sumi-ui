<sumi-app-shell [brand]="brand" [nav]="navItems">
  <sumi-app-switcher sumiShellSwitcher />
  <div sumiShellActions>
    <select
      class="accent-picker"
      name="accent"
      aria-label="Accent"
      [value]="selectedAccent"
      (change)="selectAccent($any($event.target).value)"
    >
      @for (item of accentPresets; track item.preset) {
        <option [value]="item.preset">{{ item.label }}</option>
      }
    </select>
  </div>
  <!-- sumiShellFocusActions is left empty here: the Practice page's own
       sumi-session-bar (#12) is the real "End session" control now, wired
       to its own session state. A shell-level stand-in button that bypassed
       that state (calling shell.leaveFocusMode() directly) would double up
       with it and could desync the two — see sumi-session-bar's doc
       comment for the intended placement. -->
  <router-outlet />
  <sumi-hotkey-help />
</sumi-app-shell>
